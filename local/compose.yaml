# The OpenID Provider edge on a laptop: Postgres, the API, the edge behind Caddy's TLS as
# https://auth.<APP_NAME>.localhost:<TLS_PORT>. See README.md; start it with ./up.sh, which
# generates the secrets these services read.
#
# Both services run with NODE_ENV=production, so every check a deployment meets applies here.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_USER: seamless
      POSTGRES_DB: seamless_auth
    env_file:
      - ./.generated/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seamless -d seamless_auth']
      interval: 2s
      timeout: 5s
      retries: 30

  # Stands in for SES, so a code the API emails can be read at http://127.0.0.1:<MAILBOX_PORT>.
  mailbox:
    image: ${NODE_IMAGE:-node:24-alpine}
    command: ['node', '/stack/mailbox.mjs']
    volumes:
      - ./stack:/stack:ro
    ports:
      - '127.0.0.1:${MAILBOX_PORT:-9025}:8025'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8025/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    image: ${SEAMLESS_API_IMAGE:-ghcr.io/fells-code/seamless-auth-api:v0.23.0}
    depends_on:
      postgres:
        condition: service_healthy
      mailbox:
        condition: service_healthy
    env_file:
      - ./.generated/api.env
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-myapp} (local)
      APP_ID: ${APP_NAME:-myapp}-local
      # Private, as in production: only the edge and your backends reach the API.
      ISSUER: http://api:5312
      # The provider's issuer and its flag are set by the seed, through the admin API.
      APP_ORIGINS: &edge-origin https://auth.${APP_NAME:-myapp}.localhost:${TLS_PORT:-9443}
      ORIGINS: *edge-origin
      FRONTEND_URL: *edge-origin
      RPID: ${APP_NAME:-myapp}.localhost
      DEFAULT_ROLES: user
      AVAILABLE_ROLES: user,admin
      LOGIN_METHODS: passkey,email_otp
      ACCESS_TOKEN_TTL: 30m
      REFRESH_TOKEN_TTL: 1d
      # The API's budget per client address, which counts each call the edge makes for a browser,
      # about 30 for one sign-in. One laptop signing in repeatedly would spend the deployment
      # values of 100 and 50 in a minute and wait up to 20 seconds per call. The per-route flow
      # limits on sign-in stay at their defaults.
      RATE_LIMIT: '1000'
      DELAY_AFTER: '500'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: seamless_auth
      DB_USER: seamless
      DB_LOGGING: 'false'
      OWNER_EMAIL: owner@${APP_NAME:-myapp}.localhost
      SERVE_ADMIN_DASHBOARD: 'false'
      MESSAGING_EMAIL_FROM: noreply@${APP_NAME:-myapp}.localhost
      MESSAGING_AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_SESV2: http://mailbox:8025
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - '127.0.0.1:${API_PORT:-9312}:5312'
    healthcheck:
      test: ['CMD', 'node', './dist/healthCheck.js']
      interval: 2s
      timeout: 5s
      retries: 90

  # Turns the provider on and registers the clients, the resource and the link, then exits. The
  # edge refuses to start until the provider is on, so it waits for this. ./up.sh reruns it, and a
  # rerun changes nothing.
  seed:
    image: ${NODE_IMAGE:-node:24-alpine}
    command: ['node', '/stack/seed.mjs']
    user: ${HOST_UID:-0}:${HOST_GID:-0}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:5312
      MAILBOX_URL: http://mailbox:8025
      APP_NAME: ${APP_NAME:-myapp}
      TLS_PORT: ${TLS_PORT:-9443}
      API_PORT: ${API_PORT:-9312}
      GENERATED_DIR: /generated
    volumes:
      - ./stack:/stack:ro
      - ./.generated:/generated

  edge:
    image: ${SEAMLESS_EDGE_IMAGE:-ghcr.io/fells-code/seamless-auth-oidc-provider:v0.4.1}
    depends_on:
      seed:
        condition: service_completed_successfully
    env_file:
      - ./.generated/edge.env
    environment:
      SEAMLESS_API_URL: http://api:5312
      # Caddy is the one hop in front of the edge, and the edge has no host port.
      TRUST_PROXY: 'true'
      SEAMLESS_JWKS_KID: ${APP_NAME:-myapp}-edge
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5314/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  proxy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    depends_on:
      edge:
        condition: service_healthy
    environment:
      EDGE_SITE: https://auth.${APP_NAME:-myapp}.localhost:${TLS_PORT:-9443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      default:
        # So a container reaches the issuer by the name a browser uses.
        aliases:
          - auth.${APP_NAME:-myapp}.localhost
    # The same port inside and out: the edge answers only for the issuer's own host and port.
    ports:
      - '127.0.0.1:${TLS_PORT:-9443}:${TLS_PORT:-9443}'
    healthcheck:
      test: ['CMD', 'test', '-f', '/data/caddy/pki/authorities/local/root.crt']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  caddy-data:
