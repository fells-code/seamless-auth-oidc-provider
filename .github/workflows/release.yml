name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fells-code/seamless-auth-oidc-provider'
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Version or publish package
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: 'chore: update version and changelog'
          commit-message: 'chore: update version and changelog'
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Read released version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish-image:
    name: Publish versioned image
    needs: release
    if: needs.release.outputs.published == 'true'
    # A called workflow cannot be granted more than the caller holds, so this
    # has to match docker-publish.yml's own permissions block.
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_tag: ${{ needs.release.outputs.version }}
